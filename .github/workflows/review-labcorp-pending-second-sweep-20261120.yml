name: Review unresolved official Labcorp test details
on:
  push:
    branches: [main]
    paths:
      - 'scripts/review-labcorp-pending-second-sweep-20261120.mjs'
      - '.github/workflows/review-labcorp-pending-second-sweep-20261120.yml'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review exact-code official pages
        run: node scripts/review-labcorp-pending-second-sweep-20261120.mjs
      - name: Save read-only official page evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/labcorp-pending-official-sweep-20261120.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current official Labcorp pending code requirements"
          git pull --rebase origin main
          git push origin HEAD:main
