name: Inspect official test additions
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-test-additions-20261120.mjs'
      - '.github/workflows/inspect-test-additions-20261120.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-test-additions-20261120.mjs
