name: Audit calculator discoverability and TAT
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/search/**'
      - 'index.html'
      - 'labcorp.html'
      - 'labcorp-app.js'
      - 'tests/**'
      - '.github/workflows/catalog-discoverability-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all active catalog search, filter, and TAT entries
        run: node --test tests/catalog-discoverability-tat-20261120.test.cjs tests/full-source-catalog-filters-20261120.test.cjs tests/official-labcorp-usable-expansion-20261120.test.cjs tests/official-labcorp-suitable-extra-20261120.test.cjs tests/official-labcorp-standard-cdos-20261120.test.cjs tests/verified-complex-collection-20261120.test.cjs
