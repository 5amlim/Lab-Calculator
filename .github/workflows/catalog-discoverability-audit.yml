name: Audit calculator discoverability and TAT
on:
  # Index generation runs in its own workflow. Audit the published result,
  # not the intermediate source commit while its index is still stale.
  workflow_run:
    workflows: ['Publish active test search indexes']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'assets/search/**'
      - '.github/workflows/catalog-discoverability-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all active catalog search, filter, and TAT entries
        run: node --test tests/catalog-discoverability-tat-20261120.test.cjs tests/full-source-catalog-filters-20261120.test.cjs tests/official-labcorp-usable-expansion-20261120.test.cjs tests/official-labcorp-suitable-extra-20261120.test.cjs tests/official-labcorp-standard-cdos-20261120.test.cjs tests/verified-complex-collection-20261120.test.cjs
