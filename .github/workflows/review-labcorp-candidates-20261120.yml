name: Review official Labcorp candidate collection requirements
on:
  push:
    branches: [main]
    paths:
      - 'scripts/review-labcorp-candidates-20261120.mjs'
      - '.github/workflows/review-labcorp-candidates-20261120.yml'
permissions:
  contents: write
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract current official specimen and TAT details
        run: node scripts/review-labcorp-candidates-20261120.mjs
      - name: Save source review without activating tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/labcorp-candidate-source-review-20261120.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record official Labcorp candidate specimen review"
          git pull --rebase origin main
          git push origin HEAD:main
